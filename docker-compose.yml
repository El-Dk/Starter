services:
  postgres:
    image: postgres:17-alpine
    container_name: starter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: starter_dev_password
      POSTGRES_DB: starter_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
